<body><script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const q = new URLSearchParams(location.search);
const W = +q.get('w') || 1600, H = +q.get('h') || 900;

renderer.setSize(W, H); renderer.setPixelRatio(1);

scene.background = new THREE.Color(0xc4c7cb);

window.shoot = (s) => {
  car.traverse((o) => {

    if (s.highlight) { const hit = s.highlight.some((h) => m.name === h || o.name.startsWith(h)); o.material = hit ? hot : grey; }
    else o.material = m;
    if (s.hide && s.hide.some((h) => m.name === h || o.name.startsWith(h))) o.visible = false;
    if (s.only && !s.only.some((h) => m.name === h || o.name.startsWith(h))) o.visible = false;
    if (m.name === 'headlight' || m.name === 'taillight' || m.name === 'turnlight') m.emissiveIntensity = s.glow ?? 0.4;
  });

    const w = car.getObjectByName('wheel_' + c), b = car.getObjectByName('brake_' + c);

  }

  const dir = new THREE.Vector3(...(s.dir || V[s.view || 'front34'])).normalize();

</script></body></html>
