<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script></head>
<body><script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const q = new URLSearchParams(location.search);
const W = +q.get('w') || 1600, H = +q.get('h') || 900;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);

document.body.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(4, 8, 5); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); Object.assign(key.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 0.5, far: 30 }); key.shadow.bias = -0.0005; key.shadow.radius = 4;
scene.add(key);

const gltf = await new GLTFLoader().loadAsync('/model.glb');
const car = gltf.scene;
const mode = q.get('mode') || 'pbr';
const CLASS = { paint: 0x2e8b57, trim: 0x444444, interior: 0xd2691e, headlight: 0xffff66, taillight: 0xff2222, plate: 0x3366ff, glass: 0x66ccff, rim: 0xcccccc, tyre: 0x111111, brake: 0xaa00aa };
car.traverse((o) => { if (!o.isMesh) return; o.castShadow = true; o.receiveShadow = true;
  if (mode === 'class') { const n = o.material.name; o.material = new THREE.MeshStandardMaterial({ color: CLASS[n] ?? 0xff00ff, roughness: 0.6, transparent: n === 'glass', opacity: n === 'glass' ? 0.35 : 1 }); }
  if (mode === 'pbr' && (o.material.name === 'headlight' || o.material.name === 'taillight')) o.material.emissiveIntensity = +(q.get('glow') ?? 0.6);
});
if (q.get('hide')) for (const n of q.get('hide').split(',')) car.traverse((o) => { if (o.isMesh && (o.name === n || o.material.name === n)) o.visible = false; });
if (q.get('spin') || q.get('steer')) {
  const spin = +(q.get('spin') || 0), steer = +(q.get('steer') || 0);
  for (const n of ['wheel_fl', 'wheel_fr', 'wheel_rl', 'wheel_rr']) {
    const w = car.getObjectByName(n); const b = car.getObjectByName(n.replace('wheel', 'brake'));
    const pivot = new THREE.Group(); pivot.position.copy(w.position); w.parent.add(pivot);
    w.position.set(0, 0, 0); pivot.add(w); if (b) { b.position.set(0, 0, 0); pivot.add(b); }

const box = new THREE.Box3().setFromObject(car); const ctr = box.getCenter(new THREE.Vector3());

const view = q.get('view') || 'front34';
const dist = +q.get('dist') || 9.5;
const V = { front34: [0.62, 0.22, 0.75], rear34: [-0.62, 0.24, -0.75], side: [1, 0.06, 0], front: [0, 0.12, 1], rear: [0, 0.15, -1], top: [0.0001, 1, 0.0001], under: [0.001, -1, 0.001], sideR: [-1, 0.06, 0], cockpit: [0.35, 0.9, 0.3] };
const dir = new THREE.Vector3(...(q.get('dir') ? q.get('dir').split(',').map(Number) : V[view])).normalize();
const target = q.get('target') ? new THREE.Vector3(...q.get('target').split(',').map(Number)) : new THREE.Vector3(ctr.x, ctr.y * 0.8, ctr.z);

</script></body></html>
