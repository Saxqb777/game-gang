<body><script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

window.shoot = (s) => {

    if (!o.isMesh) return;

    if (s.highlight) o.material = match(o, s.highlight) ? hot : grey; else o.material = m;

  });

  const V = { front34: [0.62, 0.22, 0.75], rear34: [-0.62, 0.24, -0.75], side: [1, 0.05, 0], sideR: [-1, 0.05, 0], front: [0, 0.1, 1], rear: [0, 0.12, -1], top: [0.0001, 1, 0.0001], under: [0.001, -1, 0.001] };

</script></body></html>
