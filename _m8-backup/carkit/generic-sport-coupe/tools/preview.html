<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#d9dadc;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const W = 1600, H = 1000;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd4d6d9);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.03).texture;
scene.environmentIntensity = 1.0;
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(4, 8, 5); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 6; key.shadow.bias = -0.0005;
Object.assign(key.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 0.5, far: 20 });
scene.add(key);
const ground = new THREE.Mesh(new THREE.CircleGeometry(30, 64), new THREE.MeshStandardMaterial({ color: 0xc9cbce, roughness: 0.9 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const camera = new THREE.PerspectiveCamera(30, W / H, 0.05, 100);
const gltf = await new GLTFLoader().loadAsync('/car.glb');
const car = gltf.scene;
car.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
scene.add(car);
const params = new URLSearchParams(location.search);
if (params.get('debug') === 'normals') car.traverse((o) => { if (o.isMesh) o.material = new THREE.MeshNormalMaterial({ side: THREE.FrontSide }); });
if (params.get('only')) car.traverse((o) => { if (o.isMesh && !o.name.startsWith(params.get('only'))) o.visible = false; });
window.views = {
  front: [[5.2, 1.7, 6.3], [0, 0.55, 0.1]],
  rear: [[-5.0, 1.9, -6.4], [0, 0.6, -0.1]],
  side: [[9.6, 1.0, 0], [0, 0.62, 0]],
  top: [[0.01, 11, 0], [0, 0, 0]],
  wheel: [[2.6, 0.6, 2.6], [0.84, 0.38, 1.47]],
  cabin: [[0.45, 1.25, -0.75], [0.1, 0.85, 0.35]],
  frontOn: [[0, 0.9, 9.5], [0, 0.6, 0]],
  rearOn: [[0, 1.0, -9.5], [0, 0.6, 0]],
  wheelR: [[2.2, 0.45, -1.47], [0.84, 0.38, -1.47]],
  under: [[3.5, -0.6, 3.5], [0, 0.3, 0]],
};
window.shot = (name) => {
  const [p, t] = window.views[name];
  camera.position.set(...p); camera.lookAt(...t);
  if (name === 'top') camera.up.set(0, 0, -1); else camera.up.set(0, 1, 0);
  camera.lookAt(...t);
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/png');
};
window.__car = car; window.ready = true;
</script></body></html>
